[package]
name = "postgresx"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "PostgreSQL adapter with pooled parameterized SQL, transactions, migrations and rustls TLS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/postgresx"
homepage = "https://github.com/bytechainx/postgresx"
documentation = "https://docs.rs/postgresx"
readme = "README.md"
keywords = ["postgres", "postgresql", "database", "sql", "pool"]
categories = ["database", "asynchronous"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "LICENSE-*", "Cargo.toml"]

[dependencies]
bytes = "1"
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = [
    "runtime",
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-uuid-1",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tracing = "0.1"
webpki-roots = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
